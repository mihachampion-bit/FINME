<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINME</title>

<style>
body{margin:0;font-family:system-ui;background:#f6f7f9}
.hidden{display:none}
header{display:flex;gap:8px;padding:8px;background:#fff;border-bottom:1px solid #ddd}
button{padding:6px 10px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer}
.table-wrap{overflow:auto;background:#fff;border:1px solid #ddd;margin:8px}
table{border-collapse:collapse}
th,td{border:1px solid #ddd;padding:4px 6px;font-size:13px}
th{background:#fafafa}
.sticky-left{position:sticky;left:0;background:#fff;z-index:2}
.sticky-top{position:sticky;top:0;background:#fff;z-index:3}

.modal-backdrop{
  position:fixed;inset:0;
  background:#0006;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}
.modal{
  background:#fff;
  padding:12px;
  width:90%;
  max-width:400px;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <button id="btnAddDate">Добавить дату</button>
</header>

<div class="table-wrap" id="tableWrap"></div>

<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <input id="amountInput" type="number" step="0.1" placeholder="Сумма">
    <br><br>
    <button id="btnAdd">Добавить</button>
    <button id="btnClose">Закрыть</button>
  </div>
</div>

<script>
/* ---------- helpers ---------- */
const fmt=n=>n.toLocaleString("ru-RU",{minimumFractionDigits:1,maximumFractionDigits:1});
const dates=[];
let transactions=[];
let currentDate=null;

/* ---------- render ---------- */
function render(){
  const w=document.getElementById("tableWrap");
  w.innerHTML="";
  const t=document.createElement("table");

  const h=document.createElement("tr");
  const th=document.createElement("th");
  th.textContent="Дата";
  th.className="sticky-left sticky-top";
  h.appendChild(th);
  t.appendChild(h);

  dates.forEach(d=>{
    const tr=document.createElement("tr");
    const td=document.createElement("td");
    td.textContent=d;
    td.className="sticky-left";
    td.style.cursor="pointer";
    td.addEventListener("click",()=>openModal(d));
    tr.appendChild(td);
    t.appendChild(tr);
  });

  w.appendChild(t);
}

/* ---------- modal ---------- */
const backdrop=document.getElementById("modalBackdrop");
const title=document.getElementById("modalTitle");
const amount=document.getElementById("amountInput");

function openModal(date){
  currentDate=date;
  title.textContent=date;
  amount.value="";
  backdrop.classList.remove("hidden");
}

function closeModal(){
  backdrop.classList.add("hidden");
  currentDate=null;
}

/* ---------- events ---------- */
document.getElementById("btnClose").addEventListener("click",closeModal);
document.getElementById("btnAdd").addEventListener("click",()=>{
  const v=+amount.value;
  if(v>0){
    transactions.push({date:currentDate,amount:v});
    closeModal();
  }
});
backdrop.addEventListener("click",closeModal);
document.querySelector(".modal").addEventListener("click",e=>e.stopPropagation());

document.getElementById("btnAddDate").addEventListener("click",()=>{
  const s=prompt("Дата ДД.ММ.ГГГГ");
  if(!s) return;
  dates.unshift(s);
  render();
});

/* ---------- start ---------- */
render();
</script>

</body>
</html>
