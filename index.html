<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FINME — Финансовый учёт</title>

<style>
:root{
  --bg:#f6f7f9;
  --fg:#111;
  --muted:#777;
  --accent:#2563eb;
  --border:#dcdfe4;
  --expense:#dc2626;
  --income:#16a34a;
  --sticky-bg:#ffffffee;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
  background:var(--bg);
  color:var(--fg);
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  gap:8px;
  padding:8px;
}

header button{
  padding:6px 10px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:6px;
  cursor:pointer;
}

header button.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

main{padding:8px}

.hidden{display:none}

.table-wrap{
  overflow:auto;
  border:1px solid var(--border);
  background:#fff;
}

table{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
}

th,td{
  border:1px solid var(--border);
  padding:4px 6px;
  font-size:13px;
  text-align:right;
  white-space:normal;
}

th{
  background:#fafafa;
  font-weight:600;
}

th.date{
  text-align:center;
}

th.sticky-top{
  position:sticky;
  top:0;
  z-index:5;
  background:var(--sticky-bg);
}

td.sticky-left, th.sticky-left{
  position:sticky;
  left:0;
  z-index:4;
  background:var(--sticky-bg);
  text-align:left;
  min-width:140px;
}

td.sticky-left.level-0{
  font-weight:700;
  text-transform:uppercase;
}

td.sticky-left.level-1{
  padding-left:18px;
}

.cell{
  cursor:pointer;
}

.cell.expense{color:var(--expense)}
.cell.income{color:var(--income)}

footer{
  margin-top:8px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

footer button{
  padding:6px 10px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:6px;
  cursor:pointer;
}

/* Modal */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:#0006;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
}

.modal{
  background:#fff;
  width:95%;
  max-width:520px;
  max-height:90%;
  overflow:auto;
  border-radius:10px;
  padding:10px;
}

.modal h3{margin:4px 0 8px}

.modal label{
  display:block;
  font-size:12px;
  margin-top:6px;
}

.modal input, .modal select, .modal textarea{
  width:100%;
  padding:6px;
  font-size:14px;
}

.modal table{
  width:100%;
  margin-top:8px;
}

.modal table td{
  font-size:12px;
}

.toast{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
  z-index:200;
}
</style>
</head>

<body>

<header>
  <button id="tabAccount" class="active">Учёт</button>
  <button id="tabAnalytics">Аналитика</button>
  <button id="btnManage">☰ Управление</button>
</header>

<main>
  <!-- ACCOUNT -->
  <section id="accountSection">
    <div class="table-wrap" id="tableWrap"></div>
    <footer>
      <button id="btnAddDate">Добавить дату</button>
      <button id="btnExportJSON">Экспорт JSON</button>
      <button id="btnExportCSV">Экспорт CSV</button>
      <button id="btnImportJSON">Импорт JSON</button>
      <button id="btnReset">Сброс</button>
    </footer>
  </section>

  <!-- ANALYTICS -->
  <section id="analyticsSection" class="hidden">
    <p style="color:#555;font-size:14px">
      Аналитика строится по всем транзакциям.  
      (В этой версии — базовые суммы и доли расходов.)
    </p>
    <div id="analyticsContent"></div>
  </section>
</main>

<!-- MODAL -->
<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <button onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script>
/* =========================
   Helpers
========================= */
const CURRENCY = "руб.";
const fmt = n => n.toLocaleString("ru-RU",{minimumFractionDigits:1,maximumFractionDigits:1});

function toast(msg){
  const t=document.createElement("div");
  t.className="toast";
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

function parseDMY(s){
  const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s);
  if(!m) return null;
  const d=new Date(+m[3],m[2]-1,+m[1]);
  if(d.getDate()!=+m[1]||d.getMonth()!=m[2]-1) return null;
  return d;
}
function dmy(d){
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
}

/* =========================
   IndexedDB
========================= */
let db;
const DB_NAME="FINME_DB";
const DB_VER=1;

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      db.createObjectStore("meta",{keyPath:"key"});
      db.createObjectStore("blocks",{keyPath:"id"});
      db.createObjectStore("articles",{keyPath:"id"});
      db.createObjectStore("transactions",{keyPath:"id"});
    };
    r.onsuccess=e=>{db=e.target.result;res()};
    r.onerror=e=>rej(e);
  });
}
function tx(store,mode="readonly"){
  return db.transaction(store,mode).objectStore(store);
}

/* =========================
   State
========================= */
let blocks=[], articles=[], transactions=[], dates=[];

/* =========================
   Init data
========================= */
function uuid(){return crypto.randomUUID()}

async function loadAll(){
  blocks = await getAll("blocks");
  articles = await getAll("articles");
  transactions = await getAll("transactions");

  if(blocks.length===0){
    const b1={id:uuid(),name:"ПРОДУКТЫ",hidden:false};
    const b2={id:uuid(),name:"ТРАНСПОРТ",hidden:false};
    blocks=[b1,b2];
    articles=[
      {id:uuid(),blockId:b1.id,name:"Продукты",hidden:false},
      {id:uuid(),blockId:b1.id,name:"Напитки",hidden:false},
      {id:uuid(),blockId:b2.id,name:"Метро",hidden:false},
      {id:uuid(),blockId:b2.id,name:"Такси",hidden:false},
    ];
    await saveAll();
  }

  const start=new Date(new Date().getFullYear(),0,1);
  const today=new Date();
  dates=[];
  for(let d=new Date(today);d>=start;d.setDate(d.getDate()-1)){
    dates.push(dmy(new Date(d)));
  }
}

function getAll(store){
  return new Promise(res=>{
    const r=tx(store).getAll();
    r.onsuccess=()=>res(r.result||[]);
  });
}
async function saveAll(){
  await clearStore("blocks"); for(const b of blocks) tx("blocks","readwrite").put(b);
  await clearStore("articles"); for(const a of articles) tx("articles","readwrite").put(a);
  await clearStore("transactions"); for(const t of transactions) tx("transactions","readwrite").put(t);
}
function clearStore(s){
  return new Promise(res=>{
    const r=tx(s,"readwrite").clear();
    r.onsuccess=()=>res();
  });
}

/* =========================
   Rendering table
========================= */
function renderTable(){
  const wrap=document.getElementById("tableWrap");
  wrap.innerHTML="";
  const table=document.createElement("table");

  // header
  const trh=document.createElement("tr");
  const th0=document.createElement("th");
  th0.className="sticky-top sticky-left";
  th0.textContent="Категория";
  trh.appendChild(th0);

  for(const d of dates){
    const th=document.createElement("th");
    th.colSpan=2;
    th.className="date sticky-top";
    th.textContent=d;
    trh.appendChild(th);
  }
  table.appendChild(trh);

  const trh2=document.createElement("tr");
  const th00=document.createElement("th");
  th00.className="sticky-top sticky-left";
  trh2.appendChild(th00);
  for(const _ of dates){
    const thE=document.createElement("th"); thE.textContent="Р"; trh2.appendChild(thE);
    const thI=document.createElement("th"); thI.textContent="П"; trh2.appendChild(thI);
  }
  table.appendChild(trh2);

  for(const b of blocks.filter(b=>!b.hidden)){
    const trB=document.createElement("tr");
    const tdB=document.createElement("td");
    tdB.textContent=b.name;
    tdB.className="sticky-left level-0";
    trB.appendChild(tdB);
    trB.appendChild(document.createElement("td"));
    table.appendChild(trB);

    for(const a of articles.filter(a=>a.blockId===b.id && !a.hidden)){
      const tr=document.createElement("tr");
      const td=document.createElement("td");
      td.textContent=a.name;
      td.className="sticky-left level-1";
      tr.appendChild(td);

      for(const d of dates){
        const sumE=sumCell(d,a.id,"expense");
        const sumI=sumCell(d,a.id,"income");

        const tdE=document.createElement("td");
        tdE.className="cell expense";
        tdE.textContent=sumE?fmt(sumE):"";
        tdE.onclick=()=>openModal(d,b.id,a.id,"expense");
        tr.appendChild(tdE);

        const tdI=document.createElement("td");
        tdI.className="cell income";
        tdI.textContent=sumI?fmt(sumI):"";
        tdI.onclick=()=>openModal(d,b.id,a.id,"income");
        tr.appendChild(tdI);
      }
      table.appendChild(tr);
    }
  }

  wrap.appendChild(table);
}

function sumCell(dmyDate,articleId,type){
  const iso=parseDMY(dmyDate).toISOString().slice(0,10);
  return transactions
    .filter(t=>t.dateISO===iso && t.articleId===articleId && t.type===type)
    .reduce((s,t)=>s+t.amount,0);
}

/* =========================
   Modal
========================= */
let modalCtx=null;

function openModal(dmyDate,blockId,articleId,type){
  modalCtx={dmyDate,blockId,articleId,type};
  const iso=parseDMY(dmyDate).toISOString().slice(0,10);
  document.getElementById("modalTitle").textContent=dmyDate;
  const body=document.getElementById("modalBody");
  body.innerHTML="";

  const list=document.createElement("div");
  for(const t of transactions.filter(t=>t.dateISO===iso && t.articleId===articleId)){
    const row=document.createElement("div");
    row.textContent=`${t.type==="expense"?"−":"+"}${fmt(t.amount)} ${t.source||""}`;
    row.onclick=()=>{ transactions=transactions.filter(x=>x.id!==t.id); renderTable(); openModal(dmyDate,blockId,articleId,type); };
    list.appendChild(row);
  }
  body.appendChild(list);

  const inp=document.createElement("input");
  inp.type="number";
  inp.step="0.1";
  inp.placeholder="Сумма";
  body.appendChild(inp);

  const btn=document.createElement("button");
  btn.textContent="Добавить";
  btn.onclick=()=>{
    const v=+inp.value;
    if(v>0){
      transactions.push({
        id:uuid(),
        dateISO:iso,
        type,
        blockId,
        articleId,
        amount:v
      });
      renderTable();
      openModal(dmyDate,blockId,articleId,type);
    }
  };
  body.appendChild(btn);

  document.getElementById("modalBackdrop").classList.remove("hidden");
}
function closeModal(){
  document.getElementById("modalBackdrop").classList.add("hidden");
}

/* =========================
   Buttons
========================= */
document.getElementById("tabAccount").onclick=()=>{
  accountSection.classList.remove("hidden");
  analyticsSection.classList.add("hidden");
};
document.getElementById("tabAnalytics").onclick=()=>{
  accountSection.classList.add("hidden");
  analyticsSection.classList.remove("hidden");
  analyticsContent.textContent="Всего расходов: "+
    fmt(transactions.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0))+" "+CURRENCY;
};

document.getElementById("btnAddDate").onclick=()=>{
  const s=prompt("Дата ДД.ММ.ГГГГ");
  const d=parseDMY(s);
  if(!d) return toast("Некорректная дата");
  const f=dmy(d);
  if(!dates.includes(f)){
    dates.push(f);
    dates.sort((a,b)=>parseDMY(b)-parseDMY(a));
    renderTable();
  }
};

document.getElementById("btnExportJSON").onclick=()=>{
  const data={blocks,articles,transactions};
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  a.download="finme.json";
  a.click();
};

document.getElementById("btnExportCSV").onclick=()=>{
  let csv="date,type,block,article,amount\n";
  for(const t of transactions){
    const b=blocks.find(b=>b.id===t.blockId)?.name||"";
    const a=articles.find(a=>a.id===t.articleId)?.name||"";
    csv+=`${t.dateISO},${t.type},${b},${a},${t.amount}\n`;
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="finme.csv";
  a.click();
};

document.getElementById("btnImportJSON").onclick=()=>{
  const i=document.createElement("input");
  i.type="file";
  i.accept=".json";
  i.onchange=async()=>{
    const d=JSON.parse(await i.files[0].text());
    blocks=d.blocks||[];
    articles=d.articles||[];
    transactions=d.transactions||[];
    await saveAll();
    renderTable();
  };
  i.click();
};

document.getElementById("btnReset").onclick=async()=>{
  if(confirm("Стереть все данные?")){
    await clearStore("blocks");
    await clearStore("articles");
    await clearStore("transactions");
    location.reload();
  }
};

/* =========================
   Start
========================= */
(async()=>{
  await openDB();
  await loadAll();
  renderTable();
})();
</script>

</body>
</html>
