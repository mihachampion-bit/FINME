<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FINME</title>

<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --border:#dcdfe4; --text:#222; --muted:#6b7280;
  --accent:#2563eb; --danger:#dc2626;
  --radius:10px; --shadow:0 10px 30px rgba(0,0,0,.12);
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  --leftW: 180px;
  --cellW: 92px;

  --zHead: 50;
  --zLeft: 40;
  --zCorner: 60;
}

*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text)}
header{
  position:sticky;top:0;z-index:1000;background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;gap:10px;align-items:center;padding:8px 12px;
}
header h1{margin:0;font-size:15px;font-weight:800}
header .spacer{flex:1}
button{
  border:1px solid var(--border); background:#fff;
  padding:7px 10px; border-radius:8px; cursor:pointer; font-size:13px;
}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}

.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--border)}
.tabs button{border:none;background:none;border-bottom:2px solid transparent;padding:10px 14px;font-size:14px}
.tabs button.active{border-bottom-color:var(--accent);color:var(--accent);font-weight:800}

main{height:calc(100vh - 86px);min-height:0;display:flex;flex-direction:column}
.view{height:100%;min-height:0}

/* ===== Ledger ===== */
.ledgerShell{height:100%;min-height:0;display:flex;flex-direction:column}
.windowbar{
  background:#fff;border-bottom:1px solid var(--border);
  display:flex;gap:8px;align-items:center;padding:8px 10px;
}
.windowbar .hint{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.tableWrap{flex:1;min-height:0;overflow:auto;background:#fff}

/* One table: sticky header + sticky left column */
.ledgerTable{
  border-collapse:separate;border-spacing:0;
  width:max-content; min-width:100%;
}
.ledgerTable th,.ledgerTable td{
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:6px;
  vertical-align:top;
  font-size:13px;
  white-space:normal;
  word-break:break-word;
}
.ledgerTable thead th{
  position:sticky; top:0;
  background:#f9fafb;
  z-index:var(--zHead);
  text-align:center;
  font-size:12px;
}
.ledgerTable .leftHead,
.ledgerTable .leftCell{
  position:sticky; left:0;
  z-index:var(--zLeft);
  background:#fff;
  min-width:var(--leftW);
  max-width:65vw;
}
.ledgerTable thead .leftHead{
  z-index:var(--zCorner);
  background:#f9fafb;
  text-align:left;
}
.ledgerTable .blockRow .leftCell{
  font-weight:900;
  text-transform:uppercase;
  background:#f3f4f6;
}
.ledgerTable .blockRow td:not(.leftCell){background:#f3f4f6}
.ledgerTable .articleName{padding-left:18px}
.ledgerTable td.amount{text-align:right;cursor:pointer;min-width:var(--cellW)}
.ledgerTable td.amount:hover{background:#eef2ff}

/* ===== Analytics ===== */
.analytics{padding:12px;overflow:auto}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:12px}
.panel h2{margin:8px 0 10px;font-size:15px}
label{display:block;font-size:12px;color:var(--muted);margin-top:8px}
input,select,textarea{width:100%;padding:7px 9px;font-size:13px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>div{flex:1;min-width:160px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{border:1px solid var(--border);background:#fff;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
small.muted{color:var(--muted)}

/* ===== Modals ===== */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:2000}
.modal{
  width:100%;max-width:560px;max-height:90vh;overflow:auto;
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px
}
.topbar{display:flex;gap:8px;align-items:center}
.topbar h3{margin:0;font-size:16px;flex:1}
.topbar button{border:1px solid var(--border);background:#fff;padding:6px 9px;border-radius:8px;cursor:pointer}

.quickRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.quickRow .label{font-size:12px;color:var(--muted)}
.quickRow button{padding:7px 9px}
.quickRow button.qExpense{border-color:#f59e0b}
.quickRow button.qIncome{border-color:#10b981}

.card{border:1px solid var(--border);border-radius:10px;padding:8px}
.cardTop{display:flex;gap:8px;align-items:baseline}
.cardTop .title{font-weight:800;font-size:13px;flex:1}
.cardTop .sum{font-weight:900;font-size:13px}
.card .meta{font-size:12px;color:var(--muted);margin-top:4px}
.card .note{font-size:12px;margin-top:4px;white-space:pre-wrap}
.card .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.card .btnrow button{border:1px solid var(--border);background:#fff;padding:7px 9px;border-radius:8px;cursor:pointer}
.card .btnrow button.danger{background:var(--danger);border-color:var(--danger);color:#fff}

.toast{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  background:#111;color:#fff;padding:9px 12px;border-radius:10px;font-size:13px;
  display:none;z-index:3000;max-width:min(92vw,680px)
}

.footerHelp{
  border-top:1px solid var(--border);
  background:#fff;padding:10px 12px;font-size:12px;color:#444;line-height:1.35
}

@media (max-width:768px){
  :root{--leftW:170px;--cellW:82px}
  header h1{font-size:14px}
  .windowbar .hint{display:none}
}
</style>
</head>

<body>
<header>
  <button id="btnMenu" title="Управление">☰</button>
  <h1>FINME</h1>
  <div class="spacer"></div>
  <button id="btnAddDate" class="primary">Добавить дату</button>
  <button id="btnExport">Экспорт</button>
  <button id="btnImport">Импорт</button>
  <button id="btnReset" title="Сбросить все данные">Сброс</button>
</header>

<div class="tabs">
  <button id="tabLedger" class="active">Учет</button>
  <button id="tabAnalytics">Аналитика</button>
</div>

<main>
  <section id="viewLedger" class="view" style="display:block">
    <div class="ledgerShell">
      <div class="windowbar">
        <button id="btnWinNewer">◀ Новее</button>
        <button id="btnWinOlder">Старее ▶</button>
        <div class="hint" id="winHint"></div>
      </div>

      <div class="tableWrap" id="tableWrap">
        <div style="padding:12px;color:var(--muted);font-size:13px">Загрузка…</div>
      </div>

      <div class="footerHelp">
        <b>Подсказки:</b><br/>
        • Клик/тап по сумме открывает “Детализацию”.<br/>
        • Самый свежий день — слева. При больших периодах листай окно “Новее/Старее”.<br/>
        • Хранилище: IndexedDB (подходит для многолетнего учёта).
      </div>
    </div>
  </section>
